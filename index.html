<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Perpustakaan SMK Negeri 1 Gedong Tataan</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Segoe UI', sans-serif;
    }

    body {
      background: linear-gradient(135deg, #4facfe, #00f2fe);
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      max-width: 1100px;
      margin: auto;
      background: white;
      padding: 20px;
      border-radius: 15px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.2);
    }

    h1 {
      text-align: center;
      margin-bottom: 20px;
      color: #333;
    }

    form {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 15px;
      margin-bottom: 20px;
    }

    input {
      padding: 10px;
      border-radius: 8px;
      border: 1px solid #ccc;
      outline: none;
      transition: 0.3s;
    }

    input:focus {
      border-color: #4facfe;
    }

    button {
      grid-column: span 2;
      padding: 12px;
      border: none;
      border-radius: 10px;
      background: #4facfe;
      color: white;
      font-weight: bold;
      cursor: pointer;
      transition: 0.3s;
    }

    button:hover {
      background: #00c6ff;
    }

    .preview {
      text-align: center;
    }

    .preview img {
      width: 100px;
      border-radius: 10px;
      margin-top: 10px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 20px;
    }

    th, td {
      padding: 10px;
      text-align: center;
      border-bottom: 1px solid #ddd;
    }

    th {
      background: #4facfe;
      color: white;
    }

    tr:hover {
      background: #f1f1f1;
    }

    @media (max-width: 600px) {
      form {
        grid-template-columns: 1fr;
      }

      button {
        grid-column: span 1;
      }
    }
  </style>
</head>

<body>

<div class="container">
  <h1>📚 Perpustakaan SMK Negeri 1 Gedong Tataan</h1>

  <form id="bookForm">
    <input type="text" id="penerbit" placeholder="Penerbit" required>
    <input type="text" id="judul" placeholder="Judul Buku" required>
    <input type="number" id="tahun" placeholder="Tahun" required>
    <input type="number" id="stok" placeholder="Stok" required>
    <input type="file" id="sampul" accept="image/*">

    <button type="submit">Tambah Buku</button>
  </form>

  <div class="preview">
    <p>Preview Sampul:</p>
    <img id="previewImg" src="" alt="Preview tidak ada">
  </div>

  <table>
    <thead>
      <tr>
        <th>No</th>
        <th>Sampul</th>
        <th>Judul</th>
        <th>Penerbit</th>
        <th>Tahun</th>
        <th>Stok</th>
      </tr>
    </thead>
    <tbody id="tableBody"></tbody>
  </table>
</div>

<script>
  const form = document.getElementById("bookForm");
  const tableBody = document.getElementById("tableBody");
  const previewImg = document.getElementById("previewImg");

  let books = [];

  // Preview gambar
  document.getElementById("sampul").addEventListener("change", function(e) {
    const file = e.target.files[0];
    if (file) {
      previewImg.src = URL.createObjectURL(file);
    }
  });

  form.addEventListener("submit", function(e) {
    e.preventDefault();

    const penerbit = document.getElementById("penerbit").value;
    const judul = document.getElementById("judul").value;
    const tahun = document.getElementById("tahun").value;
    const stok = document.getElementById("stok").value;
    const sampulFile = document.getElementById("sampul").files[0];

    const sampulURL = sampulFile ? URL.createObjectURL(sampulFile) : "";

    const book = {
      penerbit,
      judul,
      tahun,
      stok,
      sampul: sampulURL
    };

    books.push(book);
    renderTable();

    form.reset();
    previewImg.src = "";
  });

  function renderTable() {
    tableBody.innerHTML = "";

    books.forEach((book, index) => {
      const row = `
        <tr>
          <td>${index + 1}</td>
          <td><img src="${book.sampul}" width="60"></td>
          <td>${book.judul}</td>
          <td>${book.penerbit}</td>
          <td>${book.tahun}</td>
          <td>${book.stok}</td>
        </tr>
      `;
      tableBody.innerHTML += row;
    });
  }
</script>

</body>
</html>
